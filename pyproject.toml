[project]
name = "sitk"
version = "0.1.0"
description = "Stay In The Know: Instagram follower/following deltas and event posts to Discord"
requires-python = ">=3.11"
dependencies = [
    "instaloader>=4.15",
    "httpx>=0.27",
    "dateparser>=1.2",
    "pycryptodomex>=3.20",  # decrypt Chrome's cookie DB (Safe Storage key)
    "requests>=2.31",       # cookie jar with full attributes for instaloader's session
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
sitk = "sitk.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
